# Compose de la aplicación AranJuez360. El proxy público se administra por
# separado con docker-compose.proxy.yml y comparte la red externa "proxy".
name: aranjuez360

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AGENT_CHECKPOINT_SQLITE_PATH: /app/datos/agent_checkpoints.sqlite3
    volumes:
      - media:/app/mediafiles
      - static:/app/staticfiles
      - datos:/app/datos
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend
    # Alias estable para que el Caddy compartido lo encuentre en otro Compose.
    expose:
      - "80"
    networks:
      default:
      proxy:
        aliases:
          - aranjuez360-web

volumes:
  postgres:
  media:
  static:
  datos:

networks:
  proxy:
    external: true
    name: proxy
